<!-- 이스터 에그: 매트릭스 디지털 레인 효과 (모바일/PC 겸용) -->
<script>
(function() {
  let inputBuffer = "";
  const targetWord = "matrix";
  let tapCount = 0;
  let lastTapTime = 0;

  // 1. 키보드 입력 감지 (PC용)
  window.addEventListener("keydown", (e) => {
    if (e.key.length === 1) {
      inputBuffer += e.key.toLowerCase();
      if (inputBuffer.length > targetWord.length) inputBuffer = inputBuffer.slice(-targetWord.length);
      if (inputBuffer === targetWord) {
        startMatrixEffect();
        inputBuffer = "";
      }
    }
  });

  // 2. 터치 입력 감지 (모바일용: 3번 빠르게 클릭/터치)
  document.addEventListener("click", () => {
    const currentTime = new Date().getTime();
    if (currentTime - lastTapTime < 500) { // 0.5초 이내에 연속 터치 확인
      tapCount++;
    } else {
      tapCount = 1;
    }
    lastTapTime = currentTime;

    if (tapCount === 3) {
      startMatrixEffect();
      tapCount = 0;
    }
  });

  function startMatrixEffect() {
    if (document.getElementById("matrix-canvas")) return;

    const canvas = document.createElement("canvas");
    canvas.id = "matrix-canvas";
    canvas.style.position = "fixed";
    canvas.style.top = "0";
    canvas.style.left = "0";
    canvas.style.width = "100vw";
    canvas.style.height = "100vh";
    canvas.style.zIndex = "999999";
    canvas.style.background = "black";
    document.body.appendChild(canvas);

    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1023456789".split("");
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const rainDrops = Array(Math.floor(columns)).fill(1);

    const draw = () => {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0F0";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < rainDrops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
        rainDrops[i]++;
      }
    };

    const matrixInterval = setInterval(draw, 30);

    // 모바일 종료 버튼
    const closeBtn = document.createElement("div");
    closeBtn.innerText = "터치하여 종료";
    closeBtn.style.position = "fixed";
    closeBtn.style.bottom = "20px";
    closeBtn.style.left = "50%";
    closeBtn.style.transform = "translateX(-50%)";
    closeBtn.style.color = "#0F0";
    closeBtn.style.padding = "10px 20px";
    closeBtn.style.border = "1px solid #0F0";
    closeBtn.style.borderRadius = "5px";
    closeBtn.style.zIndex = "1000000";
    document.body.appendChild(closeBtn);

    closeBtn.addEventListener("click", () => {
      clearInterval(matrixInterval);
      canvas.remove();
      closeBtn.remove();
    });
  }
})();
</script>
